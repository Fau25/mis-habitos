# Compila y pasa las pruebas en cada cambio de codigo/. Si fallan, avisa (la web no se toca).
name: Pruebas
on:
  push:
    paths: ['codigo/**']
  workflow_dispatch:
jobs:
  pruebas:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: codigo } }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: npm, cache-dependency-path: codigo/package-lock.json }
      - run: npm ci
      - run: npx oxlint src
      - run: npm run build
      - run: pip install playwright && python -m playwright install --with-deps chromium
      - run: python tests/app.test.py 2>&1 | tee salida.txt; r=${PIPESTATUS[0]}; grep -E "Error|error" salida.txt | tail -3 | sed "s/^/::error::/"; exit $r
        shell: bash
